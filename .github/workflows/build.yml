name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          chmod +x scripts/make-app.sh
          scripts/make-app.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: SnykDesk
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Snyk Desk $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed. Unzip, move Snyk Desk to Applications, then right-click and choose Open the first time (the app is not notarized)."
